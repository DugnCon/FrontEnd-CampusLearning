name: Deploy User App

on:
  push:
    branches: ["main"]
    paths:
      - 'frontend/user-app/**'    # CHỈ chạy khi user-app thay đổi
      - '!frontend/admin-app/**'  # KHÔNG chạy khi admin-app thay đổi

jobs:
  deploy:
    name: Build & Deploy User FE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend/user-app
        run: npm ci --legacy-peer-deps
      - name: Build FE (Vite)
        working-directory: ./frontend/user-app
        run: npm run build
        env:
          VITE_FACEBOOK_APP_ID: ${{ secrets.VITE_FACEBOOK_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_REDIRECT_URI: ${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}
          VITE_CODE_SERVER_URL: ${{ secrets.VITE_CODE_SERVER_URL }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Prepare server (backup + clean old FE)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            FE_DIR="/var/www/campuslearning-user/html"
            BACKUP_BASE="/var/www/campuslearning-user"

            # Xóa toàn bộ backup cũ
            sudo rm -rf $BACKUP_BASE/html_backup_*

            # Tạo backup mới
            BACKUP_DIR="$BACKUP_BASE/html_backup_$(date +%Y%m%d_%H%M%S)"
            sudo cp -r $FE_DIR $BACKUP_DIR || true

            # Clean FE folder
            sudo rm -rf $FE_DIR/*
      
      - name: Upload new build (dist)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "./frontend/user-app/dist/*"
          target: "/var/www/campuslearning-user/html"
          strip_components: 3

      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart nginx