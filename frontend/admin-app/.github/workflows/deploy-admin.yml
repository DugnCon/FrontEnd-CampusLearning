name: Deploy Vite React FE

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Build & Deploy FE
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install dependencies (bỏ qua peer dependency strict)
      - name: Install dependencies
        working-directory: ./frontend/admin-app
        run: npm ci --legacy-peer-deps

      # 4. Build FE
      - name: Build FE (Vite)
        working-directory: ./frontend/admin-app
        run: npm run build

      # 5. Backup old FE + clean
      - name: Prepare server (backup + clean old FE)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            FE_DIR="/var/www/campuslearning-admin/html"
            BACKUP_DIR="/var/www/campuslearning-admin/html_backup_$(date +%Y%m%d_%H%M%S)"
            sudo cp -r $FE_DIR $BACKUP_DIR || true
            sudo rm -rf $FE_DIR/*

      # 6. Upload new build
      - name: Upload new build (dist)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "./frontend/admin-app/build/*"
          target: "/var/www/campuslearning-admin/html"
          strip_components: 1

      # 7. Restart Nginx
      - name: Restart Nginx
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart nginx