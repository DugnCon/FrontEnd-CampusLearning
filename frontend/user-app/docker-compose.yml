version: '3.8'

services:
  user-frontend:
    build: .
    container_name: user-frontend
    restart: always
    ports:
      - "5004:80"  # Dùng port 5004 cho HTTP
      #- "443:443"  # Dùng port 443 cho HTTPS
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
      - webroot:/var/www/certbot
    networks:
      - campus-network

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certs:/etc/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h;
      done;
      "
    command: >
      certonly --webroot -w /var/www/certbot
      --email damdaidung9b@gmail.com
      --agree-tos --no-eff-email
      --staging=false
      -d campuslearning.site -d www.campuslearning.site
      --force-renewal

volumes:
  certs:
  webroot:

networks:
  campus-network:
    driver: bridge