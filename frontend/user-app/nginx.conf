# HTTP → HTTPS + Certbot challenge
server {
    listen 80;
    server_name campuslearning.site www.campuslearning.site;

    # Cho Certbot xác thực
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả về HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name campuslearning.site www.campuslearning.site;

    ssl_certificate /etc/letsencrypt/live/campuslearning.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campuslearning.site/privkey.pem;

    # SSL config tốt
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}