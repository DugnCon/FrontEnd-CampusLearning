server {
    listen 80;
    server_name localhost;

    # === FRONTEND USER SPA ===
    location /user/ {
        alias /usr/share/nginx/html/user/;
        try_files $uri $uri/ /user/index.html;

        # Không cache HTML
        location = /user/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Cache static files
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|wasm)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # (Tùy chọn) Nếu có admin app
    # location /admin/ { ... }

    # Root → redirect về /user/
    location / {
        return 301 /user/;
    }
}